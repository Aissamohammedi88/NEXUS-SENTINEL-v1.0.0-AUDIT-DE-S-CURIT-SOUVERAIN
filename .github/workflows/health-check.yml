# .github/workflows/context-drift.yml
name: Context Drift

on:
  schedule:
    - cron: '0 8 * * 1'  # Lundi 8h
  workflow_dispatch:

jobs:
  detect:
    name: "🔍 Drift Detection"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Extract Version from Code
        id: code
        run: |
          # Extrait la version depuis pyproject.toml ou __init__.py
          if [ -f pyproject.toml ]; then
            CODE_VERSION=$(grep '^version' pyproject.toml | cut -d'"' -f2)
          elif [ -f src/__init__.py ]; then
            CODE_VERSION=$(grep '__version__' src/__init__.py | cut -d'"' -f2)
          fi
          echo "VERSION=$CODE_VERSION" >> $GITHUB_OUTPUT

      - name: Extract Version from README
        id: readme
        run: |
          README_VERSION=$(grep -oE 'v[0-9]+\.[0-9]+\.[0-9]+' README.md | head -n1 | tr -d 'v')
          echo "VERSION=$README_VERSION" >> $GITHUB_OUTPUT

      - name: Compare Versions
        run: |
          CODE=${{ steps.code.outputs.VERSION }}
          README=${{ steps.readme.outputs.VERSION }}
          
          if [ "$CODE" != "$README" ]; then
            echo "::error::Drift détecté : code=$CODE, README=$README"
            echo "### 🔍 Context Drift Detected" >> $GITHUB_STEP_SUMMARY
            echo "- Code version: \`$CODE\`" >> $GITHUB_STEP_SUMMARY
            echo "- README version: \`$README\`" >> $GITHUB_STEP_SUMMARY
            exit 1
          fi
          echo "✓ Aucune dérive détectée."
