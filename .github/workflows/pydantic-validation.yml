# .github/workflows/pydantic-validation.yml
name: Pydantic Schema Validation

on:
  pull_request:
    paths:
      - 'pyproject.toml'
      - 'src/**'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -e ".[dev]"
      - name: Validate Pydantic Models
        run: |
          python -c "
from pydantic import BaseModel, ValidationError
import importlib, pkgutil

# Vérifie que tous les modèles Pydantic se chargent correctement
for module_info in pkgutil.walk_packages(['src']):
    try:
        importlib.import_module(f'src.{module_info.name}')
    except ValidationError as e:
        print(f'Pydantic validation error: {e}')
        exit(1)
print('All Pydantic models validated.')
"
