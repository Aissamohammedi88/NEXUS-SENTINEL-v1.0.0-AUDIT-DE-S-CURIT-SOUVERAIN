# .github/workflows/hallucination-scanner.yml
name: Hallucination Scanner

on:
  pull_request:

jobs:
  scan:
    name: "🧠 Hallucination Detection"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Scan for Hallucinated Dependencies
        run: |
          # Extrait tous les imports du code
          grep -rhoE "^(import|from) [a-zA-Z_][a-zA-Z0-9_]*" --include="*.py" . | \
            awk '{print $2}' | cut -d'.' -f1 | sort -u > /tmp/imports.txt
          
          FAILED=0
          while read -r pkg; do
            # Vérifie que le package existe sur PyPI
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" "https://pypi.org/pypi/$pkg/json")
            if [ "$HTTP_CODE" = "404" ]; then
              echo "::error::Package halluciné détecté: $pkg (non trouvé sur PyPI)"
              FAILED=1
            fi
          done < /tmp/imports.txt
          
          if [ $FAILED -eq 1 ]; then
            exit 1
          fi
          echo "✓ Aucun package halluciné détecté."

      - name: Scan for Hallucinated URLs
        run: |
          # Extrait toutes les URLs du code
          grep -rhoE "https?://[^\"' >]+" --include="*.py" --include="*.md" . | sort -u > /tmp/urls.txt
          
          FAILED=0
          while read -r url; do
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" --max-time 5 "$url" || echo "000")
            if [ "$HTTP_CODE" = "000" ] || [ "$HTTP_CODE" = "404" ]; then
              echo "::warning::URL potentiellement hallucinée: $url (HTTP $HTTP_CODE)"
            fi
          done < /tmp/urls.txt
