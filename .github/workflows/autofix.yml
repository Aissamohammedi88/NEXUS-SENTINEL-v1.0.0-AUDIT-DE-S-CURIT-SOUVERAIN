# .github/workflows/autofix.yml
# ═══════════════════════════════════════════════════════════════════════════════
# NEXUS AUTOFIX — Correction automatique du code
# Inspiré de : autofix.ci, PR #476 de SemanticDiff
# ═══════════════════════════════════════════════════════════════════════════════

name: Autofix

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  autofix:
    name: "🔧 Auto-fix Lint & Format"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Ruff
        run: pip install ruff

      - name: Run Autofix
        uses: autofix-ci/action@v1
        with:
          # Ruff corrige les erreurs de lint et formate le code
          command: |
            ruff check --fix-only .
            ruff format .
