# .github/workflows/scope-integrity.yml
name: Scope Integrity

on:
  pull_request:
    types: [opened, synchronize]

jobs:
  verify:
    name: "📏 Scope Verification"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Calculate Scope
        id: scope
        run: |
          # Compte les fichiers modifiés
          CHANGED_FILES=$(git diff --name-only origin/main...HEAD | wc -l)
          echo "CHANGED=$CHANGED_FILES" >> $GITHUB_OUTPUT
          
          # Extrait le type de la PR (fix, feat, chore, docs)
          PR_TITLE="${{ github.event.pull_request.title }}"
          PR_TYPE=$(echo "$PR_TITLE" | grep -oE "^(fix|feat|chore|docs|refactor|test|ci|perf|build)")
          echo "TYPE=$PR_TYPE" >> $GITHUB_OUTPUT

      - name: Verify Scope Limits
        run: |
          CHANGED=${{ steps.scope.outputs.CHANGED }}
          TYPE=${{ steps.scope.outputs.TYPE }}
          
          # Limites par type de PR
          case "$TYPE" in
            fix)     MAX=5 ;;
            docs)    MAX=3 ;;
            chore)   MAX=10 ;;
            feat)    MAX=20 ;;
            refactor) MAX=30 ;;
            *)       MAX=15 ;;
          esac
          
          echo "Type: $TYPE | Fichiers modifiés: $CHANGED | Limite: $MAX"
          
          if [ "$CHANGED" -gt "$MAX" ]; then
            echo "::error::Scope dépassé : $CHANGED fichiers modifiés (max $MAX pour '$TYPE')."
            echo "### 📏 Scope Violation" >> $GITHUB_STEP_SUMMARY
            echo "Type \`$TYPE\` autorise max \`$MAX\` fichiers, mais \`$CHANGED\` ont été modifiés." >> $GITHUB_STEP_SUMMARY
            exit 1
          fi
          echo "✓ Scope respecté."
